<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>um mês de nós ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(
                    circle at top left,
                    #fff0f6 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #ffe3ef 0%,
                    transparent 35%
                ),
                #fff8fb;

            color: #70485b;
            font-family: "Quicksand", sans-serif;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "♡";
            position: fixed;
            font-family: serif;
            font-size: 150px;
            color: rgba(238, 158, 190, 0.08);
            z-index: -1;
            pointer-events: none;
        }

        body::before {
            top: 5%;
            left: -50px;
            transform: rotate(-15deg);
        }

        body::after {
            bottom: 5%;
            right: -50px;
            transform: rotate(15deg);
        }


        /* =========================
           APRESENTAÇÃO
        ========================= */

        .hero {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 50px 25px;
        }

        .small-text {
            font-size: 14px;
            letter-spacing: 2px;
            color: #b47b93;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(48px, 10vw, 80px);
            font-weight: 500;
            line-height: 0.95;
            color: #70485b;
            margin-bottom: 25px;
        }

        .hero p {
            max-width: 550px;
            font-size: 16px;
            line-height: 1.8;
            color: #8b6273;
        }


        /* =========================
           DESENHO
        ========================= */

        .couple-drawing {
            width: min(600px, 92vw);
            height: auto;

            display: block;

            margin: 35px auto 20px;

            border-radius: 20px;

            filter: drop-shadow(
                0 15px 25px
                rgba(180, 123, 147, 0.15)
            );

            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0);
            }

        }


        /* =========================
           DIVISOR
        ========================= */

        .divider {
            width: 70px;
            height: 1px;
            background: #e6b6c9;
            margin: 30px auto;
            position: relative;
        }

        .divider::after {
            content: "♡";

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background: #fff8fb;

            padding: 0 10px;

            color: #d998b3;
            font-size: 18px;
        }


        /* =========================
           CONTADOR
        ========================= */

        .countdown-section {
            min-height: 70vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 70px 25px;
        }

        .countdown-section h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(35px, 7vw, 55px);

            font-weight: 500;

            color: #70485b;

            margin-bottom: 15px;
        }

        .countdown-text {
            color: #9a7080;

            font-size: 15px;

            margin-bottom: 40px;
        }

        .countdown {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .time-box {
            min-width: 90px;

            padding: 18px 12px;

            background: rgba(255, 255, 255, 0.65);

            border: 1px solid #f0d4df;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(180, 123, 147, 0.08);

            backdrop-filter: blur(5px);
        }

        .time-number {
            display: block;

            font-family: "Cormorant Garamond", serif;

            font-size: 38px;

            line-height: 1;

            color: #70485b;

            margin-bottom: 7px;
        }

        .time-label {
            font-size: 10px;

            letter-spacing: 1.5px;

            color: #b47b93;
        }


        /* =========================
           FINALIZAÇÃO
        ========================= */

        .ending {
            min-height: 80vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 70px 25px;
        }

        .ending h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(45px, 9vw, 70px);

            font-weight: 500;

            line-height: 1;

            color: #70485b;

            margin-bottom: 30px;
        }

        .ending p {
            max-width: 600px;

            font-size: 16px;

            line-height: 1.9;

            color: #8b6273;
        }

        .heart {
            font-family: serif;

            font-size: 70px;

            color: #d998b3;

            margin-top: 40px;

            animation: heartbeat 1.8s ease-in-out infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            .hero {
                padding: 35px 20px;
            }

            .hero h1 {
                font-size: 55px;
            }

            .hero p {
                font-size: 14px;
            }

            .couple-drawing {
                width: 95vw;
                margin
